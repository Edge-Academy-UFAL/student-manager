# Banco Local
spring.datasource.url=jdbc:postgresql://localhost:5432/student-manager
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=true

# Logs detalhados para debug
logging.level.org.springframework=DEBUG
logging.level.com.academy=DEBUG

# Email (Mailtrap - Fake)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Storage (LocalStack ou MinIO Local)
aws.access.key=admin
aws.secret.key=admin123
aws.s3.endpoint=http://localhost:9000
aws.s3.bucket=studentmanager-files
aws.s3.region=us-east-1

# Frontend Local
application.frontend-url=http://localhost:3000
application.jwt-secret=minha-chave-secreta-super-segura-para-testes-123456