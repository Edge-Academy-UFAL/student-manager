spring.datasource.url=jdbc:postgresql://localhost:5432/student-manager
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=false

logging.level.org.springframework=INFO
logging.level.com.academy=INFO

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.s3.endpoint=${AWS_ENDPOINT}
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.s3.region=${AWS_REGION}

application.jwt-secret=${JWT_SECRET}
application.frontend-url=${FRONTEND_URL}