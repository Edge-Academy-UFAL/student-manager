name: CI - Server (Build & Test)

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'server/**'

jobs:
  build-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: >
          ./gradlew test bootJar