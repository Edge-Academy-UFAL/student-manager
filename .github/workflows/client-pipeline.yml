name: CI - Client

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'client/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'client/**'

jobs:
  build-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build