services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: student-manager
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    image: registry.digitalocean.com/soap-registry/backend:dev
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student-manager
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      
      # --- SECURITY ---
      APPLICATION_JWT_SECRET: ${JWT_SECRET}
      
      # --- EMAIL (Use Resend ou SendGrid aqui) ---
      SPRING_MAIL_HOST: smtp.resend.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: resend
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      
      # --- AWS S3 ---
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: ${AWS_BUCKET_NAME}
      AWS_S3_REGION: us-east-1
      
      APPLICATION_FRONTEND_URL: ${FRONTEND_URL}
      
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge