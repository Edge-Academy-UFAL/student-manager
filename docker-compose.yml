services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: student-manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - studentmanager-network

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    ports:
      - "9000:9000"
      - "9090:9090"
    command: server /data --console-address ":9090"
    volumes:
      - ./data/minio:/data
    networks:
      - studentmanager-network

  backend:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/student-manager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      
      # --- SECURITY ---
      APPLICATION_JWT_SECRET: secret_key_here
      
      # --- EMAIL (Use Resend ou SendGrid aqui) ---
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: test
      SPRING_MAIL_PASSWORD: test
      
      # --- AWS S3 ---
      AWS_ACCESS_KEY: admin
      AWS_SECRET_KEY: admin123
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: studentmanager-files
      AWS_S3_REGION: us-east-1
      
      APPLICATION_FRONTEND_URL: http://localhost:3000
    depends_on:
      - postgres
      - minio
    networks:
      - studentmanager-network

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      AUTH_TRUST_HOST: true
      NEXT_PUBLIC_SERVER_URL: http://backend:8080
      NEXTAUTH_SECRET: secret_key_here
      NEXTAUTH_URL: http://backend:3000
      NEXTAUTH_URL_INTERNAL: http://backend:3000
    networks:
      - studentmanager-network

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
        - ./data:/data
    ports:
        - 8025:8025
        - 1025:1025
    environment:
        MP_MAX_MESSAGES: 5000
        MP_DATABASE: /data/mailpit.db
        MP_SMTP_AUTH_ACCEPT_ANY: 1
        MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - studentmanager-network

volumes:
  postgres_data:

networks:
  studentmanager-network:
    driver: bridge
